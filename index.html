<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支付后台管理系统 · 操作日志</title>
</head>
<body>
<div id="routing-prototype">
  <style>
    html, body { margin:0; padding:0; min-height:100%; background:#f1f5f9; }
    #routing-prototype {
      --rp-bg:#f1f5f9; --rp-panel:#fff; --rp-border:#e2e8f0;
      --rp-text:#0f172a; --rp-muted:#64748b; --rp-primary:#475569;
      --rp-sidebar:#475569; --rp-green:#475569; --rp-red:#b45353;
      min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      font-size:13px; color:var(--rp-text); background:var(--rp-bg); line-height:1.5;
    }
    #routing-prototype * { box-sizing:border-box; }
    #routing-prototype button, #routing-prototype input, #routing-prototype select { font:inherit; }
    #routing-prototype button { cursor:pointer; }
    #routing-prototype button:disabled { cursor:not-allowed; opacity:.45; }
    #routing-prototype :focus-visible { outline:2px solid #94a3b8; outline-offset:2px; }
    .rp-shell { display:flex; min-height:100vh; align-items:stretch; }
    .rp-side { width:232px; flex:0 0 232px; background:var(--rp-sidebar); color:#f8fafc; }
    .rp-brand { height:64px; padding:0 20px; display:flex; align-items:center; font-size:16px; font-weight:700; border-bottom:1px solid rgba(255,255,255,.13); }
    .rp-nav { padding:16px 12px; position:sticky; top:0; }
    .rp-nav-section { padding:0; margin-bottom:8px; }
    .rp-nav-title { min-height:36px; padding:0 10px; display:flex; justify-content:space-between; align-items:center; border-radius:6px; background:#f1f5f9; color:#0f172a; font-size:14px; font-weight:700; }
    .rp-nav-title span:first-child { display:flex; align-items:center; gap:10px; }
    .rp-nav-title.active { background:#e2e8f0; color:#0f172a; }
    .rp-nav-title[data-nav-toggle] { cursor:pointer; }
    .rp-nav-title[data-nav-toggle] > span:last-child { display:none; }
    .rp-nav-title[data-nav-toggle]::after { content:""; width:6px; height:6px; border-right:1.5px solid #64748b; border-bottom:1.5px solid #64748b; transform:rotate(45deg); margin:0 3px 3px; transition:transform .18s; }
    .rp-nav-section.collapsed .rp-nav-title[data-nav-toggle]::after { transform:rotate(-45deg); margin-bottom:0; }
    .rp-grid-icon { display:grid; grid-template-columns:repeat(2,5px); grid-template-rows:repeat(2,5px); gap:2px; width:12px; }
    .rp-grid-icon i { background:#64748b; border-radius:1px; }
    .rp-subnav { margin-top:8px; padding-left:12px; }
    .rp-nav-section.collapsed .rp-subnav { display:none; }
    .rp-subnav button { display:flex; align-items:center; min-height:32px; width:100%; padding:0 10px; margin:2px 0; border:0; border-radius:6px; background:transparent; color:#f8fafc; text-align:left; transition:background .16s,color .16s; }
    .rp-subnav button:hover { background:#cbd5e1; color:#0f172a; }
    .rp-subnav button.active { background:#e2e8f0; color:#0f172a; font-weight:650; }
    .rp-main { flex:1; min-width:0; padding:14px; }
    .rp-content { min-height:calc(100vh - 28px); padding:0 14px; border:1px solid var(--rp-border); border-radius:8px; background:#fff; }
    .rp-heading { min-height:82px; display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--rp-border); }
    .rp-heading h1 { margin:0; font-size:18px; font-weight:700; line-height:26px; }
    .rp-heading p { margin:4px 0 0; font-size:12px; color:var(--rp-muted); }
    .rp-actions { display:flex; gap:8px; }
    .rp-btn { display:inline-flex; align-items:center; justify-content:center; min-width:76px; height:34px; min-height:34px; padding:0 14px; border:1px solid var(--rp-border); border-radius:6px; background:#e2e8f0; color:#334155; font-weight:650; white-space:nowrap; box-shadow:none; }
    .rp-btn:hover { background:#cbd5e1; }
    .rp-btn.secondary { background:#fff; color:#334155; }
    .rp-btn.secondary:hover, .rp-btn.ghost { background:#f8fafc; }
    .rp-filter { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; padding:14px 0; border-bottom:1px solid var(--rp-border); }
    .rp-field { display:flex; flex-direction:column; gap:6px; min-width:0; width:256px; max-width:100%; }
    .rp-field.small { width:256px; }
    .rp-field label { font-size:13px; color:#475569; }
    .rp-input, .rp-select { width:100%; min-width:0; height:36px; padding:0 10px; border:1px solid #d9e0ea; border-radius:6px; color:#334155; background:#fff; outline:none; }
    .rp-input:hover, .rp-select:hover { border-color:#94a3b8; }
    .rp-input:focus, .rp-select:focus { border-color:#64748b; box-shadow:0 0 0 2px rgba(100,116,139,.12); }
    .rp-input:disabled, .rp-select:disabled { background:#f1f5f9; color:#94a3b8; }
    .rp-field:has(.rp-date-range) { width:528px; }
    .rp-date-range { display:flex; align-items:center; gap:8px; }
    .rp-date-range .rp-input { width:calc((100% - 30px)/2); }
    .rp-date-range > span { color:#64748b; flex:none; }
    .rp-table-wrap { margin-top:14px; overflow:auto; background:#fff; border-radius:4px; }
    .rp-table, .rp-log-table { width:100%; border-collapse:collapse; table-layout:auto; font-size:13px; }
    .rp-table { min-width:860px; }
    .rp-table th, .rp-table td, .rp-log-table th, .rp-log-table td { height:42px; border:1px solid var(--rp-border); padding:0 10px; text-align:left; white-space:nowrap; overflow:visible; text-overflow:clip; color:#334155; vertical-align:middle; }
    .rp-table th, .rp-log-table th { height:38px; font-weight:650; background:#f8fafc; color:#334155; }
    .rp-table tbody tr:hover td, .rp-log-table tbody tr:hover td { background:#f8fafc; }
    .rp-table th:first-child { width:104px; min-width:104px; }
    .rp-table td:first-child, .rp-table th:first-child { text-align:center; }
    .rp-table th:nth-child(2) { min-width:130px; }
    .rp-table th:nth-child(3), .rp-table th:nth-child(4) { min-width:120px; }
    .rp-table th:last-child { width:88px; min-width:88px; }
    .rp-log-table { min-width:1200px; }
    .rp-log-table th:first-child { min-width:164px; }
    .rp-log-table th:nth-child(2) { min-width:90px; }
    .rp-log-table th:nth-child(3) { min-width:130px; }
    .rp-log-table th:nth-child(4), .rp-log-table th:nth-child(5) { min-width:110px; }
    .rp-log-table th:last-child { min-width:320px; }
    .rp-route-table { min-width:2100px; }
    .rp-route-table th, .rp-route-table td { min-width:120px; }
    .rp-route-table td { height:54px; }
    .rp-route-table th:last-child, .rp-route-table td:last-child { position:sticky; right:0; min-width:88px; background:#fff; box-shadow:-1px 0 0 #e2e8f0; }
    .rp-route-table th:last-child { background:#f8fafc; }
    .rp-route-table .rp-input { min-width:90px; }
    .rp-route-table input[type="checkbox"] { accent-color:#475569; width:15px; height:15px; cursor:pointer; }
    .rp-route-table input[data-route-field="whiteEnabled"], .rp-route-table input[data-route-field="antiComplaint"] { appearance:none; width:34px; height:18px; margin:0; border:0; border-radius:18px; background:#cbd5e1; position:relative; vertical-align:middle; transition:background .18s; }
    .rp-route-table input[data-route-field="whiteEnabled"]::after, .rp-route-table input[data-route-field="antiComplaint"]::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; background:#fff; border-radius:50%; box-shadow:0 1px 3px #0f172a2e; transition:transform .18s; }
    .rp-route-table input[data-route-field="whiteEnabled"]:checked, .rp-route-table input[data-route-field="antiComplaint"]:checked { background:#475569; }
    .rp-route-table input[data-route-field="whiteEnabled"]:checked::after, .rp-route-table input[data-route-field="antiComplaint"]:checked::after { transform:translateX(16px); }
    .rp-route-summary { display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; background:#f8fafc; border:1px solid var(--rp-border); border-radius:6px; padding:14px; margin-top:14px; }
    .rp-switch { width:34px; height:18px; flex:none; padding:0; border:0; border-radius:18px; background:#cbd5e1; position:relative; vertical-align:middle; transition:background .18s; }
    .rp-switch::after { content:""; position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 3px #0f172a2e; transition:transform .18s; }
    .rp-switch.on { background:#475569; }
    .rp-switch.on::after { transform:translateX(16px); }
    .rp-link { color:#334155; background:transparent; border:0; padding:4px 6px; font-weight:650; }
    .rp-link:hover { text-decoration:underline; }
    .rp-empty td { height:260px; color:#94a3b8; text-align:center; }
    .rp-footer { display:flex; justify-content:space-between; align-items:center; padding:14px 0; color:#64748b; gap:12px; }
    .rp-page { display:flex; gap:6px; align-items:center; }
    .rp-page button { width:28px; height:28px; padding:0; border:1px solid var(--rp-border); border-radius:6px; background:#fff; color:#475569; }
    .rp-page button.current { background:#e2e8f0; font-weight:700; color:#0f172a; }
    .rp-mask { position:fixed; inset:0; z-index:30; background:#0f172a59; display:flex; justify-content:center; align-items:center; padding:16px; }
    .rp-modal { width:min(760px,calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; background:#fff; border:1px solid var(--rp-border); border-radius:8px; box-shadow:0 18px 48px #0f172a26; }
    .rp-routing-modal { width:min(920px,calc(100vw - 32px)); }
    .rp-modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--rp-border); background:#f8fafc; }
    .rp-modal-head h2 { margin:0; font-size:16px; font-weight:700; }
    .rp-close { display:grid; place-items:center; width:28px; height:28px; padding:0; background:transparent; border:0; border-radius:6px; color:#64748b; font-size:20px; }
    .rp-close:hover { background:#e2e8f0; }
    .rp-modal-body { padding:20px; }
    .rp-routing-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 24px; }
    .rp-routing-fields .rp-field { width:auto; display:grid; grid-template-columns:80px minmax(0,1fr); align-items:center; gap:10px; }
    .rp-routing-fields .rp-field > label { text-align:right; white-space:nowrap; }
    .rp-routing-fields .rp-field.full { grid-column:1/-1; display:block; }
    .rp-required::before { content:"*"; color:#b45353; margin-right:4px; }
    .rp-unit-input { display:flex; min-width:0; }
    .rp-unit-input .rp-input { flex:1; border-radius:6px 0 0 6px; }
    .rp-unit-input > span { display:grid; place-items:center; width:46px; flex:none; height:36px; border:1px solid #d9e0ea; border-left:0; border-radius:0 6px 6px 0; background:#f8fafc; color:#64748b; }
    .rp-channel-head, .rp-channel-row { display:grid; grid-template-columns:minmax(180px,1.2fr) minmax(100px,1fr) minmax(140px,1fr) 70px; gap:8px; align-items:center; }
    .rp-channel-head { margin:2px 0 8px; color:#475569; font-weight:650; }
    .rp-channel-row { margin-bottom:8px; }
    .rp-error { display:none; color:#b45353; font-size:12px; }
    .rp-error.show { display:block; }
    .rp-routing-fields .rp-error { grid-column:2; }
    .rp-modal-foot { display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--rp-border); }
    .rp-toast { position:fixed; z-index:60; top:20px; left:50%; transform:translate(-50%,-8px); padding:10px 18px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:#334155; box-shadow:0 8px 24px #0f172a1a; opacity:0; pointer-events:none; transition:opacity .18s,transform .18s; }
    .rp-toast.show { opacity:1; transform:translate(-50%,0); }
    @media(max-width:1100px) { .rp-side { width:208px; flex-basis:208px; } .rp-brand { font-size:14px; padding:0 16px; } }
    @media(max-width:700px) { .rp-side { width:180px; flex-basis:180px; } .rp-nav { padding:12px 8px; } .rp-main { padding:8px; } .rp-content { padding:0 10px; min-height:calc(100vh - 16px); } .rp-field, .rp-field.small { width:100%; } .rp-heading { align-items:flex-start; } .rp-routing-fields { grid-template-columns:1fr; } }
    @media(prefers-reduced-motion:reduce) { #routing-prototype * { transition:none !important; } }
  </style>

  <div class="rp-shell">
    <aside class="rp-side">
      <div class="rp-brand">支付后台管理系统</div>
      <nav class="rp-nav">
        <div class="rp-nav-section"><div class="rp-nav-title"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>权限配置</span><span>⌄</span></div></div>
        <div class="rp-nav-section collapsed"><div class="rp-nav-title" data-nav-group="platform" data-nav-toggle role="button" tabindex="0" aria-expanded="false"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>平台管理</span><span>⌄</span></div><div class="rp-subnav"><button type="button" data-page="logs">▤　操作日志</button></div></div>
        <div class="rp-nav-section"><div class="rp-nav-title"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>订单管理</span><span>⌄</span></div></div>
        <div class="rp-nav-section">
          <div class="rp-nav-title active" data-nav-group="business" data-nav-toggle role="button" tabindex="0" aria-expanded="false"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>业务管理</span><span>⌃</span></div>
          <div class="rp-subnav">
            <button type="button">▤　支付成功率</button>
            <button type="button" data-page="collection">▤　代收分流</button>
            <button type="button" data-page="payout">▤　代付分流</button>
            <button type="button">▤　虚拟币代收路由</button>
            <button type="button">▤　虚拟币代付路由</button>
          </div>
        </div>
        <div class="rp-nav-section collapsed"><div class="rp-nav-title" data-nav-group="merchant" data-nav-toggle role="button" tabindex="0" aria-expanded="false"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>商户管理</span><span>⌄</span></div><div class="rp-subnav"><button type="button" data-page="merchantCollection">▤　商户代收路由</button><button type="button" data-page="merchantPayout">▤　商户代付路由</button></div></div>
        <div class="rp-nav-section"><div class="rp-nav-title"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>报表</span><span>⌄</span></div></div>
      </nav>
    </aside>
    <main class="rp-main">
      <section class="rp-content" id="rp-page-content"></section>
    </main>
  </div>
  <div class="rp-toast" id="rp-toast" role="status" aria-live="polite"></div>
  <div id="rp-overlay"></div>

  <script>
    (() => {
      const root = document.getElementById('routing-prototype');
      const page = document.getElementById('rp-page-content');
      const overlay = document.getElementById('rp-overlay');
      const toast = document.getElementById('rp-toast');
      let current = 'collection';
      let seq = 3;
      let logFilters = {start:'', end:'', business:'', type:'', merchant:''};
      let ruleFilters = {collection:{merchant:'', enabled:''}, payout:{merchant:'', enabled:''}, merchantCollection:{merchant:'', enabled:''}, merchantPayout:{merchant:'', enabled:''}};
      const routeSettings = {merchantPayout:{minutes:'30', count:'100'}};
      const data = {
        collection: [
          {id:1, enabled:true, merchant:'india02', lower:'0', upper:'5000', minutes:'10', records:'10000', uplift:'3', channels:[{name:'UPI-01', weight:'100', upper:'100'}]},
          {id:2, enabled:false, merchant:'india02', lower:'5000', upper:'10000', minutes:'10', records:'10000', uplift:'3', channels:[{name:'Razorpay', weight:'100', upper:'100'}]}
        ],
        payout: [
          {id:3, enabled:true, merchant:'india02', lower:'0', upper:'3000', minutes:'10', records:'10000', uplift:'3', channels:[{name:'Bank-A', weight:'100', upper:'100'}]}
        ],
        merchantCollection: [
          {id:101, enabled:true, merchant:'RummyX', channelName:'CowPay-代收', sort:'9', own:false, min:'100', middle:'0', max:'50000', fee:'0', quota:'0', minCount:'0', minAmount:'0', amountBase:'0', whiteEnabled:false, antiComplaint:false}
        ],
        merchantPayout: [
          {id:201, enabled:true, merchant:'india02', channelName:'StablePay-代付', sort:'1', own:false, min:'200', max:'50000', fee:'0', fixedFee:'0', bankCheck:'0'},
          {id:202, enabled:true, merchant:'india02', channelName:'BetixPay-代付', sort:'9', own:false, min:'100', max:'5000000', fee:'0', fixedFee:'0', bankCheck:'0'}
        ]
      };
      const logs = [
        {time:'2026-09-08 14:32:10', operator:'white', type:'编辑', business:'代收分流', merchant:'india02', api:'/api/routing/collection/update', params:'{"id":1,"lower":0,"upper":5000}', response:'{"code":0,"message":"success"}', detail:'下限（含）：0 → 0；上限（不含）：3000 → 5000', result:'成功'},
        {time:'2026-09-08 14:28:41', operator:'white', type:'启用', business:'代付分流', merchant:'india02', api:'/api/routing/payout/update-status', params:'{"id":3,"enabled":true}', response:'{"code":0,"message":"success"}', detail:'启用分流规则', result:'成功'}
      ];

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2200);
      }
      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
      function currentTitle() { return ({collection:'代收分流', payout:'代付分流', merchantCollection:'商户代收路由', merchantPayout:'商户代付路由', logs:'操作日志'})[current]; }
      function now() { return new Date().toLocaleString('zh-CN', {hour12:false}).replace(/\//g, '-'); }
      function formatChannels(channels) { return channels.map(channel => `${channel.name}:${Number(channel.weight || 0).toFixed(2)}%;`).join(''); }
      function formatChangeValue(value) { return Array.isArray(value) ? formatChannels(value) : String(value); }
      function formatRuleConfig(row) { return `商户：${row.merchant}；金额区间：${row.lower}～${row.upper}；支持通道：${formatChannels(row.channels)}`; }
      function formatRouteConfig(row) { return `商户：${row.merchant}；渠道名称：${row.channelName}；渠道排序：${row.sort}；金额区间：${row.min}～${row.max}`; }
      const routeFieldLabels = {channelName:'渠道名称', sort:'渠道排序', own:'自有', min:'最小（含）', middle:'普大（不含）', max:'最大（不含）', fee:'费率（%）', quota:'限额（w）', minCount:'最少充值次数', minAmount:'最少充值金额', amountBase:'金额基数', whiteEnabled:'白户', antiComplaint:'是否抗投诉', fixedFee:'固费（卢比）', bankCheck:'代付银行卡校验'};
      function recordApi(type, api, params, merchant, result = '成功', response = '{"code":0,"message":"success"}', detail = '操作完成') {
        if (result !== '成功' || !['新增', '编辑', '启用', '停用'].includes(type) || !Object.hasOwn(data, current)) return;
        logs.unshift({time:now(), operator:'white', type, business:currentTitle(), merchant:merchant || '-', api, params:JSON.stringify(params), response, detail});
      }
      function recordRuleChanges(previous, next) {
        const fields = [
          ['lower', '下限（含）'], ['upper', '上限（不含）'], ['minutes', '分钟'],
          ['records', '记录数'], ['uplift', '上浮点数'], ['channels', '渠道配置']
        ];
        const changes = [];
        fields.forEach(([key, label]) => {
          const before = key === 'channels' ? JSON.stringify(previous[key]) : String(previous[key]);
          const after = key === 'channels' ? JSON.stringify(next[key]) : String(next[key]);
          if (before !== after) changes.push({field:label, before:previous[key], after:next[key]});
        });
        if (changes.length) recordApi('编辑', `/api/routing/${current}/update`, {id:next.id, changes}, next.merchant, '成功', '{"code":0,"message":"success"}', `配置分流规则：${changes.map(change => `${change.field}：${formatChangeValue(change.before)} → ${formatChangeValue(change.after)}`).join('；')}`);
      }
      function renderMerchantRoute() {
        const filters = ruleFilters[current];
        const rows = data[current].filter(row => (!filters.merchant || row.merchant === filters.merchant) && (!filters.enabled || (filters.enabled === 'on' ? row.enabled : !row.enabled)));
        const isCollection = current === 'merchantCollection';
        const columns = isCollection ? ['是否启用','商户','渠道名称','渠道排序','自有','最小（含）','普大（不含）','最大（不含）','费率（%）','限额（w）','最少充值次数','最少充值金额','金额基数','白户开关','是否抗投诉','操作'] : ['是否启用','商户','渠道名称','渠道排序','自有','最小（含）','最大（不含）','费率（%）','固费（卢比）','代付银行卡校验','操作'];
        const input = (name, value) => `<input class="rp-input" data-route-field="${name}" value="${escapeHtml(value)}">`;
        const body = rows.length ? rows.map(row => { const cells = isCollection ? [
