<div id="routing-prototype">
  <style>
    #routing-prototype { --rp-bg:#f4f6f8; --rp-panel:#fff; --rp-border:#e4e8ee; --rp-text:#263238; --rp-muted:#8a929d; --rp-primary:#2388f2; --rp-sidebar:#353a40; --rp-sidebar-2:#2c3136; --rp-green:#16bf6d; --rp-red:#e05252; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif; color:var(--rp-text); background:var(--rp-bg); min-height:720px; font-size:14px; }
    #routing-prototype * { box-sizing:border-box; }
    #routing-prototype button, #routing-prototype select, #routing-prototype input { font:inherit; }
    #routing-prototype button { cursor:pointer; }
    .rp-shell { display:flex; min-height:720px; background:var(--rp-bg); }
    .rp-side { width:220px; flex:0 0 220px; background:var(--rp-sidebar); color:#e9edf2; }
    .rp-brand { height:64px; padding:21px 26px; font-weight:600; letter-spacing:.2px; background:var(--rp-sidebar-2); }
    .rp-nav { padding:12px 0; }
    .rp-nav-section { padding:0 22px; }
    .rp-nav-title { display:flex; align-items:center; justify-content:space-between; height:48px; color:#dbe0e6; font-size:14px; }
    .rp-nav-title span:first-child { display:flex; align-items:center; gap:12px; }
    .rp-grid-icon { width:14px; height:14px; display:inline-grid; grid-template-columns:repeat(2,5px); grid-template-rows:repeat(2,5px); gap:2px; }
    .rp-grid-icon i { display:block; background:#aab2bc; border-radius:1px; }
    .rp-nav-title.active { color:#fff; }
    .rp-nav-title.active .rp-grid-icon i { background:var(--rp-primary); }
    .rp-subnav { padding:0 0 10px 27px; }
    .rp-subnav button { display:block; width:100%; border:0; background:transparent; color:#bfc6ce; text-align:left; padding:12px 16px; border-radius:4px 0 0 4px; }
    .rp-subnav button.active { color:#fff; background:#434a52; border-left:3px solid var(--rp-primary); padding-left:13px; }
    .rp-main { min-width:0; flex:1; }
    .rp-tabs { height:48px; background:#fff; border-bottom:1px solid var(--rp-border); display:flex; align-items:stretch; overflow:auto; white-space:nowrap; }
    .rp-tab { border:0; border-right:1px solid var(--rp-border); background:#f8fafc; color:#9099a4; padding:0 24px; position:relative; }
    .rp-tab.active { color:var(--rp-primary); background:#fff; }
    .rp-tab.active:after { content:""; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:var(--rp-primary); }
    .rp-content { padding:24px 28px 36px; }
    .rp-heading { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
    .rp-heading h1 { margin:0; font-size:22px; font-weight:500; }
    .rp-heading p { margin:7px 0 0; color:var(--rp-muted); }
    .rp-actions { display:flex; gap:10px; }
    .rp-btn { min-height:34px; padding:0 16px; border:1px solid transparent; border-radius:4px; color:#fff; background:var(--rp-primary); }
    .rp-btn.secondary { color:#59636e; background:#fff; border-color:#d8dee7; }
    .rp-btn.ghost { color:var(--rp-primary); background:#eef6ff; }
    .rp-btn:disabled { opacity:.55; cursor:not-allowed; }
    .rp-filter { background:var(--rp-panel); border:1px solid var(--rp-border); padding:18px 20px; display:flex; gap:16px; align-items:end; flex-wrap:wrap; }
    .rp-field { display:flex; flex-direction:column; gap:7px; min-width:200px; }
    .rp-field.small { min-width:170px; }
    .rp-field label { color:#69737e; font-size:13px; }
    .rp-input, .rp-select { height:36px; border:1px solid #d8dee7; border-radius:4px; background:#fff; color:#36404b; padding:0 11px; outline:none; }
    .rp-input:focus, .rp-select:focus { border-color:var(--rp-primary); box-shadow:0 0 0 2px rgba(35,136,242,.12); }
    .rp-table-wrap { margin-top:16px; background:#fff; border:1px solid var(--rp-border); overflow:auto; }
    .rp-table { border-collapse:collapse; width:100%; min-width:900px; table-layout:fixed; }
    .rp-table th, .rp-table td { height:46px; border-bottom:1px solid var(--rp-border); border-right:1px solid var(--rp-border); padding:0 14px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rp-table th { height:42px; color:#78828e; background:#fbfcfd; font-weight:500; }
    .rp-table th:last-child, .rp-table td:last-child { border-right:0; }
    .rp-table tr:last-child td { border-bottom:0; }
    .rp-table th:nth-child(1) { width:90px; text-align:center; }
    .rp-table th:nth-child(2) { width:150px; }
    .rp-table th:nth-child(3), .rp-table th:nth-child(4) { width:130px; }
    .rp-table th:nth-child(5) { width:auto; }
    .rp-table th:nth-child(6) { width:160px; }
    .rp-table th:nth-child(7) { width:150px; }
    .rp-empty { height:320px; text-align:center; color:#a2aab4; }
    .rp-empty td { height:320px; }
    .rp-switch { width:38px; height:22px; border:0; border-radius:14px; background:#dfe3e8; position:relative; padding:0; vertical-align:middle; }
    .rp-switch:after { content:""; width:18px; height:18px; background:#fff; border-radius:50%; position:absolute; top:2px; left:2px; box-shadow:0 1px 3px rgba(0,0,0,.18); transition:left .16s; }
    .rp-switch.on { background:var(--rp-green); }
    .rp-switch.on:after { left:18px; }
    .rp-table .rp-switch { transform:scale(.86); transform-origin:left center; }
    .rp-link { color:var(--rp-primary); border:0; background:transparent; padding:4px 5px; }
    .rp-link.danger { color:var(--rp-red); }
    .rp-footer { display:flex; justify-content:space-between; align-items:center; padding:14px 0; color:#8b949f; }
    .rp-page { display:flex; gap:7px; align-items:center; }
    .rp-page button { width:30px; height:30px; background:#fff; border:1px solid var(--rp-border); color:#67717c; border-radius:3px; }
    .rp-page button.current { color:#fff; background:var(--rp-primary); border-color:var(--rp-primary); }
    .rp-toast { position:fixed; top:22px; right:24px; z-index:50; color:#fff; background:#27313a; padding:11px 16px; border-radius:4px; box-shadow:0 8px 20px rgba(0,0,0,.18); opacity:0; transform:translateY(-8px); pointer-events:none; transition:.18s; }
    .rp-toast.show { opacity:1; transform:translateY(0); }
    .rp-mask { position:fixed; inset:0; background:rgba(22,29,36,.42); z-index:30; display:flex; justify-content:center; align-items:center; padding:16px; }
    .rp-modal { width:min(720px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; background:#fff; border-radius:6px; box-shadow:0 16px 48px rgba(0,0,0,.24); }
    .rp-modal-head { display:flex; justify-content:space-between; align-items:center; padding:19px 22px; border-bottom:1px solid var(--rp-border); }
    .rp-modal-head h2 { margin:0; font-size:17px; font-weight:500; }
    .rp-close { border:0; background:transparent; color:#7d8791; font-size:22px; line-height:1; }
    .rp-modal-body { padding:22px; }
    .rp-form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 20px; }
    .rp-form-grid .full { grid-column:1 / -1; }
    .rp-required:before { content:"*"; color:var(--rp-red); margin-right:4px; }
    .rp-channel-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .rp-channel { display:flex; align-items:center; gap:8px; border:1px solid var(--rp-border); border-radius:4px; padding:9px 10px; color:#58636e; }
    .rp-channel input { accent-color:var(--rp-primary); }
    .rp-error { display:none; color:var(--rp-red); font-size:12px; margin-top:6px; }
    .rp-error.show { display:block; }
    .rp-modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--rp-border); }
    .rp-drawer-mask { position:fixed; inset:0; background:rgba(22,29,36,.28); z-index:28; }
    .rp-drawer { position:fixed; z-index:29; top:0; right:0; height:100vh; width:min(760px, calc(100vw - 24px)); background:#fff; box-shadow:-12px 0 32px rgba(0,0,0,.18); display:flex; flex-direction:column; }
    .rp-drawer-head { padding:19px 22px; border-bottom:1px solid var(--rp-border); display:flex; justify-content:space-between; align-items:center; }
    .rp-drawer-head h2 { margin:0; font-size:18px; font-weight:500; }
    .rp-drawer-body { padding:18px 22px; overflow:auto; }
    .rp-log-filter { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .rp-log-table { border-collapse:collapse; width:100%; min-width:640px; }
    .rp-log-table th, .rp-log-table td { text-align:left; padding:11px 9px; border-bottom:1px solid var(--rp-border); vertical-align:top; }
    .rp-log-table th { color:#77818d; font-weight:500; background:#fbfcfd; }
    .rp-log-detail { color:#727d88; font-size:12px; line-height:1.55; white-space:normal; }
    .rp-pill { display:inline-block; padding:3px 8px; border-radius:10px; font-size:12px; }
    .rp-pill.success { color:#118550; background:#e8f8f0; }
    .rp-pill.fail { color:#b53b3b; background:#fff0f0; }
    @media (max-width: 800px) { .rp-side { width:180px; flex-basis:180px; } .rp-content { padding:18px; } .rp-form-grid { grid-template-columns:1fr; } .rp-form-grid .full { grid-column:auto; } .rp-channel-list { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width: 560px) { .rp-side { display:none; } .rp-heading { display:block; } .rp-actions { margin-top:14px; } .rp-channel-list { grid-template-columns:1fr; } }
  </style>

  <div class="rp-shell">
    <aside class="rp-side">
      <div class="rp-brand">支付后台管理系统</div>
      <nav class="rp-nav">
        <div class="rp-nav-section"><div class="rp-nav-title"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>权限配置</span><span>⌄</span></div></div>
        <div class="rp-nav-section"><div class="rp-nav-title"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>平台管理</span><span>⌄</span></div></div>
        <div class="rp-nav-section"><div class="rp-nav-title"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>订单管理</span><span>⌄</span></div></div>
        <div class="rp-nav-section">
          <div class="rp-nav-title active"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>业务管理</span><span>⌃</span></div>
          <div class="rp-subnav">
            <button type="button" data-page="collection">▤　支付成功率</button>
            <button type="button" data-page="collection">▤　代收路由</button>
            <button type="button" data-page="collection">▤　代付路由</button>
            <button type="button" class="active" data-page="collection">▤　代收分流</button>
            <button type="button" data-page="payout">▤　代付分流</button>
            <button type="button" data-page="collection">▤　虚拟币代收路由</button>
            <button type="button" data-page="payout">▤　虚拟币代付路由</button>
          </div>
        </div>
        <div class="rp-nav-section"><div class="rp-nav-title"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>商户管理</span><span>⌄</span></div></div>
        <div class="rp-nav-section"><div class="rp-nav-title"><span><span class="rp-grid-icon"><i></i><i></i><i></i><i></i></span>报表</span><span>⌄</span></div></div>
      </nav>
    </aside>
    <main class="rp-main">
      <div class="rp-tabs">
        <button type="button" class="rp-tab active" data-tab="collection">代收分流　×</button>
        <button type="button" class="rp-tab" data-tab="payout">代付分流　×</button>
        <button type="button" class="rp-tab" data-tab="logs">操作日志　×</button>

  <div class="rp-toast" id="rp-toast" role="status" aria-live="polite"></div>
  <div id="rp-overlay"></div>

  <script>
    (() => {
      const root = document.getElementById('routing-prototype');
      const page = document.getElementById('rp-page-content');
      const overlay = document.getElementById('rp-overlay');
      const toast = document.getElementById('rp-toast');
      let current = 'collection';
      let seq = 3;
      const data = {
        collection: [
          {id:1, enabled:true, merchant:'india02', lower:'0', upper:'5000', channels:['UPI-01','Razorpay']},
          {id:2, enabled:false, merchant:'india02', lower:'5000', upper:'10000', channels:['Cashfree']}
        ],
        payout: [
          {id:3, enabled:true, merchant:'india02', lower:'0', upper:'3000', channels:['Bank-A','UPI-Payout']}
        ]
      };
      const logs = [
        {time:'2026-09-08 14:32:10', operator:'white', type:'修改规则', business:'代收分流', merchant:'india02', detail:'金额区间：0-3000 → 0-5000；支持通道：UPI-01、Razorpay', result:'成功'},
        {time:'2026-09-08 14:28:41', operator:'white', type:'启用规则', business:'代付分流', merchant:'india02', detail:'规则 ID：3', result:'成功'}
      ];

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2200);
      }
      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
      function currentTitle() { return current === 'collection' ? '代收分流' : '代付分流'; }
      function render() {
        if (current === 'logs') return renderLogs();
        const rows = data[current];
        const merchant = current === 'collection' ? `<th>商户</th>` : '';
        const body = rows.length ? rows.map((row, index) => `<tr>
          <td style="text-align:center">${index + 1}</td>
          ${current === 'collection' ? `<td>${escapeHtml(row.merchant)}</td>` : ''}
          <td>${escapeHtml(row.lower)}</td><td>${escapeHtml(row.upper)}</td>
          <td title="${escapeHtml(row.channels.join('、'))}">${escapeHtml(row.channels.join('、'))}</td>
          <td><button type="button" class="rp-switch ${row.enabled ? 'on' : ''}" aria-label="${row.enabled ? '已启用' : '未启用'}" data-action="toggle" data-id="${row.id}"></button><span style="margin-left:6px;color:${row.enabled ? '#118550' : '#8b949f'}">${row.enabled ? '启用' : '停用'}</span></td>
          <td><button type="button" class="rp-link" data-action="edit" data-id="${row.id}">编辑</button><button type="button" class="rp-link danger" data-action="delete" data-id="${row.id}">删除</button></td>
        </tr>`).join('') : `<tr class="rp-empty"><td colspan="${current === 'collection' ? 7 : 6}">暂无数据</td></tr>`;
        page.innerHTML = `<div class="rp-heading"><div><h1>${currentTitle()}</h1><p>按商户和启用状态管理金额区间及支持通道</p></div><div class="rp-actions"><button type="button" class="rp-btn ghost" data-action="logs">操作日志</button><button type="button" class="rp-btn" data-action="add">添加</button></div></div>
          <div class="rp-filter"><div class="rp-field small"><label>商户</label><select class="rp-select" id="rp-merchant-filter"><option value="">全部商户</option><option value="india02">india02</option><option value="RummyX">RummyX</option></select></div><div class="rp-field small"><label>是否启用</label><select class="rp-select" id="rp-status-filter"><option value="">全部状态</option><option value="on">启用</option><option value="off">停用</option></select></div><button type="button" class="rp-btn" data-action="query">查询</button><button type="button" class="rp-btn secondary" data-action="reset">重置</button></div>
          <div class="rp-table-wrap"><table class="rp-table"><thead><tr><th>序号</th>${merchant}<th>下限（含）</th><th>上限（不含）</th><th>支持通道</th><th>是否启用</th><th>操作</th></tr></thead><tbody>${body}</tbody></table></div>
          <div class="rp-footer"><span>共 ${rows.length} 条</span><div class="rp-page"><span>100条/页</span><button type="button">‹</button><button type="button" class="current">1</button><button type="button">›</button></div></div>`;
      }
      function renderLogs() {
        page.innerHTML = `<div class="rp-heading"><div><h1>操作日志</h1><p>记录代收、代付分流规则的服务端操作结果</p></div></div>
          <div class="rp-filter"><div class="rp-field small"><label>业务类型</label><select class="rp-select"><option>全部业务</option><option>代收分流</option><option>代付分流</option></select></div><div class="rp-field small"><label>操作类型</label><select class="rp-select"><option>全部操作</option><option>新增规则</option><option>修改规则</option><option>启用规则</option><option>停用规则</option><option>删除规则</option></select></div><button type="button" class="rp-btn" data-action="query">查询</button><button type="button" class="rp-btn secondary" data-action="reset">重置</button></div>
          <div class="rp-table-wrap"><table class="rp-log-table"><thead><tr><th>操作时间</th><th>操作人</th><th>业务类型</th><th>操作类型</th><th>商户</th><th>变更内容</th><th>结果</th></tr></thead><tbody>${logs.map(log => `<tr><td>${log.time}</td><td>${log.operator}</td><td>${log.business}</td><td>${log.type}</td><td>${log.merchant}</td><td class="rp-log-detail">${log.detail}</td><td><span class="rp-pill ${log.result === '成功' ? 'success' : 'fail'}">${log.result}</span></td></tr>`).join('')}</tbody></table></div>
          <div class="rp-footer"><span>共 ${logs.length} 条</span><div class="rp-page"><span>20条/页</span><button type="button">‹</button><button type="button" class="current">1</button><button type="button">›</button></div></div>`;
      }
      function openModal(type, id) {
        const row = id ? data[current].find(item => item.id === id) : null;
        const selectedChannels = row ? row.channels : [];
        overlay.innerHTML = `<div class="rp-mask" data-action="close-modal"><div class="rp-modal" role="dialog" aria-modal="true" aria-labelledby="rp-modal-title"><div class="rp-modal-head"><h2 id="rp-modal-title">${type === 'edit' ? '编辑' : '添加'}${currentTitle()}规则</h2><button type="button" class="rp-close" data-action="close-modal" aria-label="关闭">×</button></div><form id="rp-rule-form"><div class="rp-modal-body"><div class="rp-form-grid"><div class="rp-field"><label class="rp-required">商户</label><select class="rp-select" name="merchant" required><option value="">请选择</option><option value="india02" ${row && row.merchant === 'india02' ? 'selected' : ''}>india02</option><option value="RummyX" ${row && row.merchant === 'RummyX' ? 'selected' : ''}>RummyX</option></select><div class="rp-error" data-error="merchant">请选择商户</div></div><div class="rp-field"><label>是否启用</label><button type="button" class="rp-switch ${row ? (row.enabled ? 'on' : '') : ''}" data-modal-toggle="enabled" aria-label="启用状态"></button><span id="rp-modal-status" style="margin-left:8px;color:#69737e">${row ? (row.enabled ? '启用' : '停用') : '停用'}</span></div><div class="rp-field"><label class="rp-required">下限（含）</label><input class="rp-input" name="lower" inputmode="decimal" value="${row ? escapeHtml(row.lower) : ''}" placeholder="请输入金额"><div class="rp-error" data-error="range">请输入有效金额区间</div></div><div class="rp-field"><label class="rp-required">上限（不含）</label><input class="rp-input" name="upper" inputmode="decimal" value="${row ? escapeHtml(row.upper) : ''}" placeholder="请输入金额"><div class="rp-error" data-error="range2">上限必须大于下限</div></div><div class="rp-field full"><label class="rp-required">支持通道</label><div class="rp-channel-list">${['UPI-01','Razorpay','Cashfree','Bank-A','UPI-Payout','Wallet-Pay'].map(ch => `<label class="rp-channel"><input type="checkbox" name="channels" value="${ch}" ${selectedChannels.includes(ch) ? 'checked' : ''}>${ch}</label>`).join('')}</div><div class="rp-error" data-error="channels">至少选择一个支持通道</div></div></div></div><div class="rp-modal-foot"><button type="button" class="rp-btn secondary" data-action="close-modal">取消</button><button type="submit" class="rp-btn">保存</button></div></form></div></div>`;
        const form = document.getElementById('rp-rule-form');
        let enabled = row ? row.enabled : false;
        form.querySelector('[data-modal-toggle]').addEventListener('click', () => { enabled = !enabled; const sw = form.querySelector('[data-modal-toggle]'); sw.classList.toggle('on', enabled); document.getElementById('rp-modal-status').textContent = enabled ? '启用' : '停用'; });
        form.addEventListener('submit', event => { event.preventDefault(); const fd = new FormData(form); const merchant = fd.get('merchant'); const lower = String(fd.get('lower') || '').trim(); const upper = String(fd.get('upper') || '').trim(); const channels = fd.getAll('channels'); let valid = true; if (!merchant) { form.querySelector('[data-error="merchant"]').classList.add('show'); valid = false; } else form.querySelector('[data-error="merchant"]').classList.remove('show'); if (!/^\d+(\.\d{1,2})?$/.test(lower) || !/^\d+(\.\d{1,2})?$/.test(upper)) { form.querySelector('[data-error="range"]').classList.add('show'); valid = false; } else { form.querySelector('[data-error="range"]').classList.remove('show'); if (Number(lower) >= Number(upper)) { form.querySelector('[data-error="range2"]').classList.add('show'); valid = false; } else form.querySelector('[data-error="range2"]').classList.remove('show'); } if (!channels.length) { form.querySelector('[data-error="channels"]').classList.add('show'); valid = false; } else form.querySelector('[data-error="channels"]').classList.remove('show'); if (!valid) return; const action = row ? '修改规则' : '新增规则'; if (row) Object.assign(row, {merchant, lower, upper, channels, enabled}); else data[current].push({id:seq++, enabled, merchant, lower, upper, channels}); logs.unshift({time:'2026-09-08 15:00:00', operator:'white', type:action, business:currentTitle(), merchant, detail:`金额区间：${lower}-${upper}；支持通道：${channels.join('、')}`, result:'成功'}); overlay.innerHTML = ''; render(); showToast(`${action}成功`); });
      }
      function openLogs() {
        overlay.innerHTML = `<div class="rp-drawer-mask" data-action="close-drawer"></div><aside class="rp-drawer"><div class="rp-drawer-head"><h2>操作日志</h2><button type="button" class="rp-close" data-action="close-drawer" aria-label="关闭">×</button></div><div class="rp-drawer-body"><div class="rp-log-filter"><select class="rp-select"><option>全部业务</option><option>代收分流</option><option>代付分流</option></select><select class="rp-select"><option>全部操作</option><option>新增规则</option><option>修改规则</option><option>启用规则</option><option>停用规则</option><option>删除规则</option></select><button type="button" class="rp-btn" data-action="query">查询</button></div><div style="overflow:auto"><table class="rp-log-table"><thead><tr><th>时间</th><th>操作</th><th>商户/业务</th><th>结果</th></tr></thead><tbody>${logs.map(log => `<tr><td>${log.time}<div class="rp-log-detail">${log.operator}</div></td><td>${log.type}<div class="rp-log-detail">${log.detail}</div></td><td>${log.merchant}<div class="rp-log-detail">${log.business}</div></td><td><span class="rp-pill ${log.result === '成功' ? 'success' : 'fail'}">${log.result}</span></td></tr>`).join('')}</tbody></table></div></div></aside>`;
      }
      function setCurrent(next) { current = next; document.querySelectorAll('[data-tab]').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === current)); document.querySelectorAll('.rp-subnav button').forEach(btn => btn.classList.toggle('active', btn.dataset.page === current && btn.textContent.includes(current === 'collection' ? '代收分流' : '代付分流'))); render(); }
      root.addEventListener('click', event => { const target = event.target.closest('[data-action], [data-tab]'); if (!target) return; if (target.dataset.tab) return setCurrent(target.dataset.tab); const action = target.dataset.action; if (action === 'add') return openModal('add'); if (action === 'edit') return openModal('edit', Number(target.dataset.id)); if (action === 'logs') return openLogs(); if (action === 'close-modal' || action === 'close-drawer') return overlay.innerHTML = ''; if (action === 'query') return showToast('查询已完成'); if (action === 'reset') { render(); return showToast('筛选条件已重置'); } if (action === 'toggle') { const row = data[current].find(item => item.id === Number(target.dataset.id)); if (!row) return; row.enabled = !row.enabled; logs.unshift({time:'2026-09-08 15:02:00', operator:'white', type:row.enabled ? '启用规则' : '停用规则', business:currentTitle(), merchant:row.merchant, detail:`规则 ID：${row.id}`, result:'成功'}); render(); return showToast(row.enabled ? '规则已启用' : '规则已停用'); } if (action === 'delete') { const row = data[current].find(item => item.id === Number(target.dataset.id)); if (!row) return; overlay.innerHTML = `<div class="rp-mask"><div class="rp-modal" role="dialog" aria-modal="true"><div class="rp-modal-head"><h2>删除确认</h2><button type="button" class="rp-close" data-action="close-modal" aria-label="关闭">×</button></div><div class="rp-modal-body"><p style="margin:0;color:#59636e">确认删除 ${escapeHtml(currentTitle())}规则 ${row.id}？删除后将无法继续使用该规则。</p></div><div class="rp-modal-foot"><button type="button" class="rp-btn secondary" data-action="close-modal">取消</button><button type="button" class="rp-btn" data-action="confirm-delete" data-id="${row.id}">确认删除</button></div></div></div>`; } if (action === 'confirm-delete') { const id = Number(target.dataset.id); const row = data[current].find(item => item.id === id); data[current] = data[current].filter(item => item.id !== id); logs.unshift({time:'2026-09-08 15:04:00', operator:'white', type:'删除规则', business:currentTitle(), merchant:row ? row.merchant : '-', detail:`规则 ID：${id}`, result:'成功'}); overlay.innerHTML = ''; render(); showToast('规则已删除'); } });
      root.addEventListener('click', event => { const nav = event.target.closest('[data-page]'); if (nav) setCurrent(nav.dataset.page); });
      render();
    })();
  </script>
</div>
