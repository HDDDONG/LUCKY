  <script>
    (() => {
      const root = document.getElementById('routing-prototype');
      const page = document.getElementById('rp-page-content');
      const overlay = document.getElementById('rp-overlay');
      const toast = document.getElementById('rp-toast');
      let current = 'collection';
      let seq = 3;
      let logFilters = {start:'', end:'', business:'', type:''};
      const data = {
        collection: [
          {id:1, enabled:true, merchant:'india02', lower:'0', upper:'5000', minutes:'10', records:'10000', uplift:'3', channels:[{name:'UPI-01', weight:'100', upper:'100'}]},
          {id:2, enabled:false, merchant:'india02', lower:'5000', upper:'10000', minutes:'10', records:'10000', uplift:'3', channels:[{name:'Razorpay', weight:'100', upper:'100'}]}
        ],
        payout: [
          {id:3, enabled:true, merchant:'india02', lower:'0', upper:'3000', minutes:'10', records:'10000', uplift:'3', channels:[{name:'Bank-A', weight:'100', upper:'100'}]}
        ]
      };
      const logs = [
        {time:'2026-09-08 14:32:10', operator:'white', type:'编辑规则', business:'代收分流', merchant:'india02', api:'/api/routing/collection/update', params:'{"id":1,"lower":0,"upper":5000}', response:'{"code":0,"message":"success"}', detail:'下限（含）：0 → 0；上限（不含）：3000 → 5000', result:'成功'},
        {time:'2026-09-08 14:28:41', operator:'white', type:'启用规则', business:'代付分流', merchant:'india02', api:'/api/routing/payout/update-status', params:'{"id":3,"enabled":true}', response:'{"code":0,"message":"success"}', detail:'启用分流规则', result:'成功'}
      ];

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2200);
      }
      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
      function currentTitle() { return current === 'collection' ? '代收分流' : current === 'payout' ? '代付分流' : '分流日志'; }
      function now() { return new Date().toLocaleString('zh-CN', {hour12:false}).replace(/\//g, '-'); }
      function formatChannels(channels) { return channels.map(channel => `${channel.name}:${Number(channel.weight || 0).toFixed(2)}%;`).join(''); }
      function formatChangeValue(value) { return Array.isArray(value) ? formatChannels(value) : String(value); }
      function formatRuleConfig(row) { return `商户：${row.merchant}；金额区间：${row.lower}～${row.upper}；支持通道：${formatChannels(row.channels)}`; }
      function recordApi(type, api, params, merchant, result = '成功', response = '{"code":0,"message":"success"}', detail = '操作完成') {
        if (result !== '成功') return;
        logs.unshift({time:now(), operator:'white', type, business:currentTitle(), merchant:merchant || '-', api, params:JSON.stringify(params), response, detail});
      }
      function recordRuleChanges(previous, next) {
        const fields = [
          ['lower', '下限（含）'], ['upper', '上限（不含）'], ['minutes', '分钟'],
          ['records', '记录数'], ['uplift', '上浮点数'], ['channels', '渠道配置']
        ];
        const changes = [];
        fields.forEach(([key, label]) => {
          const before = key === 'channels' ? JSON.stringify(previous[key]) : String(previous[key]);
          const after = key === 'channels' ? JSON.stringify(next[key]) : String(next[key]);
          if (before !== after) changes.push({field:label, before:previous[key], after:next[key]});
        });
        if (changes.length) recordApi('编辑规则', `/api/routing/${current}/update`, {id:next.id, changes}, next.merchant, '成功', '{"code":0,"message":"success"}', `配置分流规则：${changes.map(change => `${change.field}：${formatChangeValue(change.before)} → ${formatChangeValue(change.after)}`).join('；')}`);
      }
      function render() {
        if (current === 'logs') return renderLogs();
        const rows = data[current];
        const merchant = current === 'collection' ? `<th>商户</th>` : '';
        const body = rows.length ? rows.map(row => `<tr>
          <td><button type="button" class="rp-switch ${row.enabled ? 'on' : ''}" aria-label="${row.enabled ? '已启用' : '未启用'}" data-action="toggle" data-id="${row.id}"></button></td>
          ${current === 'collection' ? `<td>${escapeHtml(row.merchant)}</td>` : ''}
          <td>${escapeHtml(row.lower)}</td><td>${escapeHtml(row.upper)}</td>
          <td title="${escapeHtml(formatChannels(row.channels))}">${escapeHtml(formatChannels(row.channels))}</td>
          <td><button type="button" class="rp-link" data-action="edit" data-id="${row.id}">编辑</button></td>
        </tr>`).join('') : `<tr class="rp-empty"><td colspan="${current === 'collection' ? 6 : 5}">暂无数据</td></tr>`;
        page.innerHTML = `<div class="rp-heading"><div><h1>${currentTitle()}</h1><p>按商户和启用状态管理金额区间及支持通道</p></div><div class="rp-actions"><button type="button" class="rp-btn" data-action="add">添加</button></div></div>
          <div class="rp-filter"><div class="rp-field small"><label>商户</label><select class="rp-select" id="rp-merchant-filter"><option value="">全部商户</option><option value="india02">india02</option><option value="RummyX">RummyX</option></select></div><div class="rp-field small"><label>是否启用</label><select class="rp-select" id="rp-status-filter"><option value="">全部状态</option><option value="on">启用</option><option value="off">停用</option></select></div><button type="button" class="rp-btn" data-action="query">查询</button><button type="button" class="rp-btn secondary" data-action="reset">重置</button></div>
          <div class="rp-table-wrap"><table class="rp-table"><thead><tr><th>是否启用</th>${merchant}<th>下限（含）</th><th>上限（不含）</th><th>支持通道</th><th>操作</th></tr></thead><tbody>${body}</tbody></table></div>
          <div class="rp-footer"><span>共 ${rows.length} 条</span><div class="rp-page"><span>100条/页</span><button type="button">‹</button><button type="button" class="current">1</button><button type="button">›</button></div></div>`;
      }
      function renderLogs() {
        const visibleLogs = logs.filter(log => (!logFilters.start || log.time >= logFilters.start.replace('T', ' ')) && (!logFilters.end || log.time <= logFilters.end.replace('T', ' ')) && (!logFilters.business || log.business === logFilters.business) && (!logFilters.type || log.type === logFilters.type));
        page.innerHTML = `<div class="rp-heading"><div><h1>分流日志</h1><p>汇总代收分流、代付分流的成功操作，便于运营统一查询</p></div></div>
          <div class="rp-filter"><div class="rp-field small"><label>操作时间</label><div class="rp-date-range"><input class="rp-input" data-log-start type="datetime-local" value="${escapeHtml(logFilters.start)}" aria-label="开始时间"><span>至</span><input class="rp-input" data-log-end type="datetime-local" value="${escapeHtml(logFilters.end)}" aria-label="结束时间"></div></div><div class="rp-field small"><label>业务类型</label><select class="rp-select" data-log-business><option value="">全部业务</option><option value="代收分流" ${logFilters.business === '代收分流' ? 'selected' : ''}>代收分流</option><option value="代付分流" ${logFilters.business === '代付分流' ? 'selected' : ''}>代付分流</option></select></div><div class="rp-field small"><label>操作类型</label><select class="rp-select" data-log-type><option value="">全部操作</option><option value="新增规则" ${logFilters.type === '新增规则' ? 'selected' : ''}>新增规则</option><option value="编辑规则" ${logFilters.type === '编辑规则' ? 'selected' : ''}>编辑规则</option><option value="启用规则" ${logFilters.type === '启用规则' ? 'selected' : ''}>启用规则</option><option value="停用规则" ${logFilters.type === '停用规则' ? 'selected' : ''}>停用规则</option></select></div><button type="button" class="rp-btn" data-action="query">查询</button><button type="button" class="rp-btn secondary" data-action="reset">重置</button></div>
          <div class="rp-table-wrap"><table class="rp-log-table"><thead><tr><th>操作时间</th><th>操作人</th><th>业务类型</th><th>操作类型</th><th>商户</th><th>调整内容</th></tr></thead><tbody>${visibleLogs.length ? visibleLogs.map(log => `<tr><td>${escapeHtml(log.time)}</td><td>${escapeHtml(log.operator)}</td><td>${escapeHtml(log.business)}</td><td>${escapeHtml(log.type)}</td><td>${escapeHtml(log.merchant)}</td><td>${escapeHtml(log.detail)}</td></tr>`).join('') : '<tr class="rp-empty"><td colspan="6">暂无符合条件的日志</td></tr>'}</tbody></table></div>
          <div class="rp-footer"><span>共 ${visibleLogs.length} 条</span><div class="rp-page"><span>20条/页</span><button type="button">‹</button><button type="button" class="current">1</button><button type="button">›</button></div></div>`;
      }
      function openModal(type, id) {
        const row = id ? data[current].find(item => item.id === id) : null;
        const previous = row ? {...row, channels:row.channels.map(channel => ({...channel}))} : null;
        const channelEntries = row && row.channels.length ? row.channels.map(channel => ({...channel})) : [{name:'', weight:'100', upper:'100'}];
        overlay.innerHTML = `<div class="rp-mask" data-action="close-modal"><div class="rp-modal rp-routing-modal" role="dialog" aria-modal="true" aria-labelledby="rp-modal-title"><div class="rp-modal-head"><h2 id="rp-modal-title">${type === 'edit' ? '编辑' : '添加'}</h2><button type="button" class="rp-close" data-action="close-modal" aria-label="关闭">×</button></div><form id="rp-rule-form"><div class="rp-modal-body"><div class="rp-routing-fields"><div class="rp-field"><label class="rp-required">下限(含)</label><input class="rp-input" name="lower" inputmode="decimal" value="${row ? escapeHtml(row.lower) : ''}" placeholder="请输入下限"><div class="rp-error" data-error="range">请输入有效金额</div></div><div class="rp-field"><label class="rp-required">上限(不含)</label><input class="rp-input" name="upper" inputmode="decimal" value="${row ? escapeHtml(row.upper) : ''}" placeholder="请输入上限"><div class="rp-error" data-error="range2">上限必须大于下限</div></div><div class="rp-field"><label class="rp-required">分钟</label><input class="rp-input" name="minutes" inputmode="numeric" value="${row ? escapeHtml(row.minutes) : '10'}" placeholder="请输入分钟"><div class="rp-error" data-error="minutes">请输入分钟</div></div><div class="rp-field"><label class="rp-required">记录数</label><input class="rp-input" name="records" inputmode="numeric" value="${row ? escapeHtml(row.records) : '10000'}" placeholder="请输入记录数"><div class="rp-error" data-error="records">请输入记录数</div></div><div class="rp-field"><label class="rp-required">上浮点数</label><div class="rp-unit-input"><input class="rp-input" name="uplift" inputmode="decimal" value="${row ? escapeHtml(row.uplift) : '3'}" placeholder="请输入上浮点数"><span>%</span></div></div><div class="rp-field full"><div class="rp-channel-head"><span>渠道</span><span>权重</span><span>上限</span><span></span></div><div data-channel-list></div><button type="button" class="rp-btn" data-action="add-channel">添加</button><div class="rp-error" data-error="channels">请选择渠道</div></div></div></div><div class="rp-modal-foot"><button type="button" class="rp-btn secondary" data-action="close-modal">取消</button><button type="submit" class="rp-btn">确定</button></div></form></div></div>`;
        const form = document.getElementById('rp-rule-form');
        const channelList = form.querySelector('[data-channel-list]');
        const channelOptions = ['CowPay-代收','UPI-01','Razorpay','Cashfree','Bank-A','UPI-Payout','Wallet-Pay'];
        function renderChannelRows() { channelList.innerHTML = channelEntries.map((item, index) => `<div class="rp-channel-row" data-channel-index="${index}"><select class="rp-select" name="channel"><option value="">请选择渠道</option>${channelOptions.map(ch => `<option value="${ch}" ${item.name === ch ? 'selected' : ''}>${ch}</option>`).join('')}</select><input class="rp-input" name="weight" inputmode="numeric" value="${escapeHtml(item.weight || '100')}" placeholder="权重"><div class="rp-unit-input"><input class="rp-input" name="channelUpper" inputmode="decimal" value="${escapeHtml(item.upper || '100')}" placeholder="上限"><span>%</span></div><span></span></div>`).join(''); }
        renderChannelRows();
        channelList.addEventListener('input', event => { const line = event.target.closest('[data-channel-index]'); if (!line) return; const item = channelEntries[Number(line.dataset.channelIndex)]; if (event.target.name === 'channel') item.name = event.target.value; if (event.target.name === 'weight') item.weight = event.target.value; if (event.target.name === 'channelUpper') item.upper = event.target.value; });
        channelList.addEventListener('change', event => { const line = event.target.closest('[data-channel-index]'); if (!line) return; const item = channelEntries[Number(line.dataset.channelIndex)]; if (event.target.name === 'channel') item.name = event.target.value; });
        form.querySelector('[data-action="add-channel"]').addEventListener('click', () => { channelEntries.push({name:'', weight:'100', upper:'100'}); renderChannelRows(); });
        form.addEventListener('submit', event => { event.preventDefault(); const fd = new FormData(form); const lower = String(fd.get('lower') || '').trim(); const upper = String(fd.get('upper') || '').trim(); const channels = channelEntries.filter(item => item.name).map(item => ({name:item.name, weight:String(item.weight || '100'), upper:String(item.upper || '100')})); let valid = true; if (!/^\d+(\.\d{1,2})?$/.test(lower) || !/^\d+(\.\d{1,2})?$/.test(upper)) { form.querySelector('[data-error="range"]').classList.add('show'); valid = false; } else { form.querySelector('[data-error="range"]').classList.remove('show'); if (Number(lower) >= Number(upper)) { form.querySelector('[data-error="range2"]').classList.add('show'); valid = false; } else form.querySelector('[data-error="range2"]').classList.remove('show'); } if (!/^\d+$/.test(String(fd.get('minutes') || '')) ) { form.querySelector('[data-error="minutes"]').classList.add('show'); valid = false; } if (!/^\d+$/.test(String(fd.get('records') || '')) ) { form.querySelector('[data-error="records"]').classList.add('show'); valid = false; } if (!channels.length) { form.querySelector('[data-error="channels"]').classList.add('show'); valid = false; } else form.querySelector('[data-error="channels"]').classList.remove('show'); if (!valid) return; const merchant = row ? row.merchant : 'india02'; const action = row ? '编辑规则' : '新增规则'; const id = row ? row.id : seq++; const next = {id, enabled:row ? row.enabled : false, merchant, lower, upper, minutes:String(fd.get('minutes')), records:String(fd.get('records')), uplift:String(fd.get('uplift') || '3'), channels}; if (row) { Object.assign(row, next); recordRuleChanges(previous, next); } else { data[current].push(next); recordApi(action, `/api/routing/${current}/create`, next, merchant, '成功', '{"code":0,"message":"success"}', `新增分流规则：${formatRuleConfig(next)}`); } overlay.innerHTML = ''; render(); showToast(`${action}成功`); });
      }
      function setCurrent(next) { current = next; document.querySelectorAll('[data-tab]').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === current)); document.querySelectorAll('.rp-subnav button').forEach(btn => btn.classList.toggle('active', btn.dataset.page === current && (current === 'logs' ? btn.textContent.includes('分流日志') : btn.textContent.includes(current === 'collection' ? '代收分流' : '代付分流')))); render(); }
      root.addEventListener('click', event => { const target = event.target.closest('[data-action], [data-tab]'); if (!target) return; if (target.dataset.tab) return setCurrent(target.dataset.tab); const action = target.dataset.action; if ((action === 'close-modal') && target.classList.contains('rp-mask') && event.target !== target) return; if (action === 'add') return openModal('add'); if (action === 'edit') return openModal('edit', Number(target.dataset.id)); if (action === 'logs') return setCurrent('logs'); if (action === 'close-modal' || action === 'close-drawer') return overlay.innerHTML = ''; if (action === 'query') { if (current === 'logs') { logFilters = {start:document.querySelector('[data-log-start]').value, end:document.querySelector('[data-log-end]').value, business:document.querySelector('[data-log-business]').value, type:document.querySelector('[data-log-type]').value}; renderLogs(); } else { showToast('查询已完成'); } return; } if (action === 'reset') { if (current === 'logs') { logFilters = {start:'', end:'', business:'', type:''}; renderLogs(); } else { render(); } return showToast('筛选条件已重置'); } if (action === 'toggle') { const row = data[current].find(item => item.id === Number(target.dataset.id)); if (!row) return; row.enabled = !row.enabled; const actionName = row.enabled ? '启用' : '停用'; recordApi(`${actionName}规则`, `/api/routing/${current}/update-status`, {id:row.id, enabled:row.enabled}, row.merchant, '成功', '{"code":0,"message":"success"}', `${actionName}分流规则：${formatRuleConfig(row)}`); render(); return showToast(row.enabled ? '规则已启用' : '规则已停用'); } });
      root.addEventListener('click', event => { const nav = event.target.closest('[data-page]'); if (nav) setCurrent(nav.dataset.page); });
      render();
    })();
  </script>
