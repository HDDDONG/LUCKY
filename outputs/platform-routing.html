      root.addEventListener('click', event => { const target = event.target.closest('[data-action]'); if (!target || current !== 'merchantVirtualPayoutRoute') return; if (target.dataset.action === 'merchant-virtual-payout-route-query') { ruleFilters.merchantVirtualPayoutRoute.merchant = document.getElementById('rp-merchant-virtual-payout-route-merchant').value; ruleFilters.merchantVirtualPayoutRoute.enabled = document.getElementById('rp-merchant-virtual-payout-route-status').value; renderMerchantVirtualPayoutRoute(); return showToast('查询已完成'); } if (target.dataset.action === 'merchant-virtual-payout-route-toggle') { const row = data.merchantVirtualPayoutRoute.find(item => item.id === Number(target.dataset.id)); if (!row) return; row.enabled = !row.enabled; const actionName = row.enabled ? '启用' : '停用'; recordApi(actionName, '/api/routing/merchant-virtual-payout-route/update-status', {id:row.id, enabled:row.enabled}, row.merchant, '成功', '{"code":0,"message":"success"}', `${actionName}虚拟币代付路由：${formatRouteConfig(row)}`); renderMerchantVirtualPayoutRoute(); return showToast(row.enabled ? '路由已启用' : '路由已停用'); } if (target.dataset.action === 'merchant-virtual-payout-route-save') { const row = data.merchantVirtualPayoutRoute.find(item => item.id === Number(target.dataset.id)); const tr = target.closest('tr'); if (!row || !tr) return; const previous = {...row}; tr.querySelectorAll('[data-merchant-virtual-payout-route-field]').forEach(field => { row[field.dataset.merchantVirtualPayoutRouteField] = field.value; }); const changes = Object.keys(row).filter(key => !['id','enabled','merchant'].includes(key) && String(previous[key]) !== String(row[key])); if (changes.length) recordApi('编辑', '/api/routing/merchant-virtual-payout-route/save', {id:row.id, changes}, row.merchant, '成功', '{"code":0,"message":"success"}', `配置虚拟币代付路由：${changes.map(key => `${key}：${previous[key]} → ${row[key]}`).join('；')}`); renderMerchantVirtualPayoutRoute(); return showToast('保存成功'); } });
      root.addEventListener('click', event => { const nav = event.target.closest('[data-page]'); if (nav) setCurrent(nav.dataset.page); });
      root.addEventListener('click', event => {
        if (current !== 'tgInspection') return;
        const tab = event.target.closest('[data-tg-tab]');
        if (tab) { tgDashboardTab = tab.dataset.tgTab; return renderTgInspection(); }
        const button = event.target.closest('[data-tg-action]');
        if (!button) return;
        if (button.dataset.tgAction === 'shift') {
          if (tgActiveSessions.has(tgCurrentOperator.username)) {
            tgActiveSessions.delete(tgCurrentOperator.username);
            tgShift = {startedAt:null, countFromAt:null};
            renderTgInspection();
            return showToast('已结束巡检，后续周期不再计数');
          }
          const clock = tgClock();
          tgActiveSessions.add(tgCurrentOperator.username);
          tgShift = {startedAt:new Date(), countFromAt:new Date(Date.now() + clock.remainingSeconds * 1000)};
          renderTgInspection();
          return showToast(`已开始巡检，下个周期 ${clock.nextCycleStart} 起计数`);
        }
        if (button.dataset.tgAction === 'rules') return openTgRules();
        if (button.dataset.tgAction === 'query') {
          tgDashboardFilters = {date:document.getElementById('tg-filter-date').value, staff:document.getElementById('tg-filter-staff').value, keyword:document.getElementById('tg-filter-keyword').value, result:tgDashboardTab==='details' ? document.getElementById('tg-filter-result').value : tgDashboardFilters.result, anomaliesOnly:false};
          renderTgInspection(); return showToast('查询已完成（演示数据）');
        }
        if (button.dataset.tgAction === 'reset') { tgDashboardFilters = {date:tgDemoDate, staff:'', keyword:'', result:'', anomaliesOnly:false}; return renderTgInspection(); }
        if (button.dataset.tgAction === 'anomalies') { tgDashboardTab='details'; tgDashboardFilters={date:tgDemoDate,staff:'',keyword:'',result:'',anomaliesOnly:true}; return renderTgInspection(); }
        if (button.dataset.tgAction === 'view-person') { tgDashboardTab='details'; tgDashboardFilters.staff=button.dataset.username; tgDashboardFilters.keyword=''; tgDashboardFilters.result=''; tgDashboardFilters.anomaliesOnly=false; return renderTgInspection(); }
        if (button.dataset.tgAction === 'export') return exportTgReport();
      });
      overlay.addEventListener('click', event => { if (event.target.matches('[data-tg-close]') || event.target.classList.contains('rp-mask')) overlay.innerHTML=''; });
      overlay.addEventListener('submit', event => {
        if (event.target.id !== 'tg-rules-form') return;
        event.preventDefault();
        const form = new FormData(event.target), commands = String(form.get('commands')||'').split(/\r?\n/).map(value=>value.trim()).filter(Boolean);
        const interval=Number(form.get('interval')), grace=Number(form.get('grace')), missedLimit=Number(form.get('missed')), responseTimeout=Number(form.get('timeout'));
        if (!commands.length) return showToast('至少配置一条有效巡检指令');
        if (interval % 5 !== 0) return showToast('巡检周期须为 5 分钟的倍数');
        if (grace >= interval) return showToast('宽限时间须小于巡检周期');
        tgInspectionRules={commands:[...new Set(commands)],interval,grace,missedLimit,responseTimeout};
        overlay.innerHTML=''; renderTgInspection(); showToast('规则配置已保存（本地原型）');
      });
      root.addEventListener('keydown', event => { const title = event.target.closest('[data-nav-toggle]'); if (title && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); title.click(); } });
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && overlay.querySelector('[data-tg-close]')) overlay.innerHTML=''; });
      setCurrent('home');
    })();
  </script>
</div>
