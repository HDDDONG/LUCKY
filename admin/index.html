<script>
const menu=JSON.parse(document.getElementById('menu-data').textContent);
const shell=document.getElementById('shell'),nav=document.getElementById('nav'),toggle=document.getElementById('toggle');
const entries=new Map(), buttons=new Map(), groups=new Map();
const icons=['M3 10l9-7 9 7M5 9v11h14V9M9 20v-7h6v7','M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z','M5 20V10M12 20V4M19 20v-7','M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 4a4 4 0 0 1 0 7M22 21v-2a4 4 0 0 0-3-3.87','M6 3h12v18H6zM9 8h6M9 12h6M9 16h4'];
function icon(i){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','1.5');s.setAttribute('class','icon');s.setAttribute('aria-hidden','true');const p=document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',icons[i%icons.length]);s.append(p);return s;}
function render(nodes,parent=[],depth=1){const ul=document.createElement('ul');nodes.forEach((node,index)=>{const lineage=[...parent,node],li=document.createElement('li'),branch=!!node.children?.length;li.className='level-'+depth;const el=document.createElement(branch?'button':'a');el.className='item';el.dataset.id=node.id;el.title=node.name;if(depth===1)el.append(icon(index));const label=document.createElement('span');label.className='label';label.textContent=node.name;el.append(label);entries.set(node.id,{node,lineage});buttons.set(node.id,el);if(branch){el.type='button';el.setAttribute('aria-expanded','false');el.setAttribute('aria-controls','children-'+node.id);const arrow=document.createElement('span');arrow.className='chevron';el.append(arrow);const sub=document.createElement("div");sub.className="submenu";sub.append(render(node.children,lineage,depth+1));sub.id='children-'+node.id;sub.inert=true;groups.set(node.id,sub);el.addEventListener('click',()=>{setGroup(node.id,el.getAttribute('aria-expanded')!=='true');});li.append(el,sub);}else{el.href='#menu='+node.id;li.append(el);}ul.append(li);});return ul;}
function setGroup(id,open){const sub=groups.get(id);sub.classList.toggle('open',open);sub.inert=!open;buttons.get(id).setAttribute('aria-expanded',String(open));}
nav.append(render(menu));
function select(){const id=new URLSearchParams(location.hash.slice(1)).get('menu');const entry=entries.get(id);const chosen=entry&&!entry.node.children?.length?entry:entries.get(menu[0].id);buttons.forEach(el=>{el.classList.remove('active','ancestor');el.removeAttribute('aria-current');});chosen.lineage.forEach((n,i)=>{const el=buttons.get(n.id);el.classList.add(i===chosen.lineage.length-1?'active':'ancestor');if(groups.has(n.id)){setGroup(n.id,true);}});buttons.get(chosen.node.id).setAttribute('aria-current','page');const crumbs=document.getElementById('crumbs');crumbs.replaceChildren();chosen.lineage.forEach((n,i)=>{if(i){const sep=document.createElement('span');sep.className='separator';sep.textContent='/';crumbs.append(sep);}const span=document.createElement('span');span.textContent=n.name;crumbs.append(span);});document.getElementById('title').textContent=chosen.node.name;const pageHost=document.getElementById('page');pageHost.replaceChildren();pageHost.dataset.path=chosen.node.path;if(chosen.node.path==='/admin/pushConfig')renderPushConfig(pageHost);document.title=chosen.node.name+' · 后台管理系统';if(innerWidth<=700)setClosed(true);}
function setClosed(closed){shell.classList.toggle('closed',closed);toggle.setAttribute('aria-expanded',String(!closed));toggle.setAttribute('aria-label',closed?'展开侧边菜单':'收起侧边菜单');}
toggle.addEventListener('click',()=>setClosed(!shell.classList.contains('closed')));document.getElementById('overlay').addEventListener('click',()=>setClosed(true));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&innerWidth<=700)setClosed(true);});window.addEventListener('hashchange',select);select();
</script>
